<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MangoTruyện</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#000;--s1:#1c1c1e;--s2:#262629;--tx:#fff;--mu:#8e8e93;--ac:#ff5f00;--bd:#2c2c2f;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#000;z-index:11}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#000}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:23px;font-style:italic;letter-spacing:-.5px}
.lg{width:30px;height:28px;border-radius:9px;background:linear-gradient(135deg,#ff8a00,#ff3d00);display:grid;place-items:center;font-style:normal;font-size:17px}
.vip{border:1.5px solid #3a3a3d;border-radius:22px;padding:8px 16px;font-weight:700;font-size:16px;display:flex;gap:6px;align-items:center}.vip i{color:#ffb100;font-style:normal}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tb1{flex:none;padding:9px 16px;border-radius:22px;color:#a1a1a6;font-size:17px;white-space:nowrap}.tb1.on{background:#212123;color:#fff}
.sr{flex:1;display:flex;align-items:center;gap:8px;background:var(--s1);border-radius:22px;padding:0 14px;color:var(--mu)}
.sr input{flex:1;border:0;background:none;color:#fff;font:inherit;padding:11px 0;outline:0;min-width:0}
.ttl{font-size:21px;font-weight:700;flex:1}.ib{font-size:26px;padding:0 6px 3px}
main{max-width:900px;margin:0 auto}
.hero{position:relative;height:min(62vw,380px);background:#111;overflow:hidden;cursor:pointer}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center 20%;opacity:.8;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,#000b)}
.ht{position:absolute;left:16px;right:70px;bottom:26px;z-index:1}.ht h1{margin:0;font-size:clamp(24px,7vw,36px);line-height:1.12;text-shadow:0 2px 10px #000a}.ht p{margin:6px 0 0;font-size:16px;font-weight:600;color:#ddd}
.dots{position:absolute;right:16px;bottom:14px;z-index:1;display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:5px;background:#fff6}.dots i.on{width:24px;background:#e8470c}
h2{position:relative;font-size:20px;font-weight:600;margin:22px 16px 12px;display:flex;justify-content:space-between;align-items:center}
h2::before{content:"";position:absolute;left:-5px;top:-6px;width:20px;height:13px;border-radius:10px;background:linear-gradient(135deg,#ff4fa0,#ff7a30);transform:rotate(-30deg);z-index:-1}
.g3,.g2{display:grid;gap:12px;padding:0 16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g3{grid-template-columns:repeat(5,1fr)}}
.cd{position:relative;cursor:pointer;min-width:0}.cv{aspect-ratio:5/7;border-radius:12px;overflow:hidden;position:relative;background:var(--s1)}.cv.l{aspect-ratio:16/11}
.cv img{width:100%;height:100%;object-fit:cover;display:block}
.tt{font-size:16px;font-weight:600;margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3}
.bg{position:absolute;top:0;right:0;background:var(--ac);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:0 0 0 12px}
.hb{position:absolute;bottom:6px;right:6px;width:28px;height:28px;border-radius:50%;background:#0008;font-size:15px;display:grid;place-items:center}.hb.on{color:#ff4d6a}
.bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:#0006}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:#1b1b1d;display:flex;align-items:center;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom,0px));z-index:12}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:14px;color:#6e6e73;min-width:70px;padding:4px 0}nav svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav .on{color:#fff;font-weight:700}
nav .mep{flex-direction:row;gap:10px;background:#333337;border-radius:30px;padding:8px 20px 8px 8px;font-size:19px;font-weight:500}
.av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7b5cff,#4b2fd0);display:grid;place-items:center;font-weight:800;font-size:17px;color:#fff}
.li{display:flex;gap:14px;margin:0 16px 12px;background:var(--s1);border-radius:14px;padding:10px;align-items:center;cursor:pointer}.li .cv{width:76px;flex:none}.li>div:nth-child(2){flex:1;min-width:0}
.sb{font-size:14px;color:var(--mu);margin-top:3px}
.dt{display:flex;gap:16px;padding:14px 16px}.dt .cv{width:120px;flex:none}.dt h1{margin:0 0 6px;font-size:22px}.hb2{margin-top:10px;background:#2c2c2f;border-radius:20px;padding:8px 16px;font-size:15px}.hb2.on{color:#ff4d6a}
.bn{height:150px;overflow:hidden;position:relative}.bn img{width:100%;height:100%;object-fit:cover;display:block}.bn::after{content:"";position:absolute;inset:0;background:linear-gradient(#0000 35%,#000)}.dt.up{margin-top:-64px;position:relative;z-index:1}.x{color:var(--mu);padding:10px;font-size:20px}
.em{text-align:center;color:var(--mu);padding:56px 24px}.em .b2{margin-top:16px}
.b2{display:inline-block;background:var(--ac);color:#fff;font-weight:700;border-radius:24px;padding:11px 24px;font-size:16px}
.me{min-height:100vh;background:linear-gradient(#3b2f7c 0,#1a1340 260px,#000 520px);padding:20px 16px 20px}
.tl{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
.tile{background:#26262b;border:1px solid #33333a;border-radius:22px;padding:14px 16px;text-align:left;min-height:140px;display:flex;flex-direction:column;justify-content:space-between}
.tile .e{font-size:44px;line-height:1}.tile .r{display:flex;justify-content:space-between;align-items:center;font-size:17px}.cn{background:#35353b;border-radius:12px;padding:4px 10px;font-size:15px}
.me h3{margin:6px 0 12px;font-size:20px;font-weight:600;color:#ddd}
.grp{background:#26262b;border-radius:22px;padding:6px 18px;margin-bottom:26px}
.rw{display:flex;align-items:center;gap:16px;width:100%;padding:16px 0;text-align:left;font-size:19px;border-bottom:1px solid #38383d}.rw:last-child{border:0}.rw .ic{width:44px;height:44px;border-radius:50%;background:#38383d;display:grid;place-items:center;font-size:20px;flex:none}
.md{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sh{background:#1c1c1e;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px;max-height:92%;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.sh h3{margin:0 0 14px;font-size:20px}input.f{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:#000;color:#fff;font:inherit;margin-bottom:10px;outline:0}
.bt{display:block;width:100%;background:var(--ac);color:#fff;font-weight:700;border-radius:12px;padding:13px;margin-top:8px;text-align:center}.bt.g{background:#2c2c2f}
.fl{display:flex;gap:10px}.fl .bt{margin-top:0}.mu{color:var(--mu);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.chip{padding:8px 14px;border-radius:20px;background:#2c2c2f;font-size:15px}.chip.on{background:var(--ac)}
#rd{position:fixed;inset:0;background:#000;z-index:50;display:none}#rd.on{display:block}
#sc{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}#sc img{display:block;width:100%;max-width:820px;margin:0 auto;min-height:200px}
.rb{position:absolute;left:0;right:0;background:#000d;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;transition:transform .2s;z-index:2}
#t1{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}#t2{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#rd.h #t1{transform:translateY(-110%)}#rd.h #t2{transform:translateY(110%)}
.rb input[type=range]{flex:1;accent-color:var(--ac)}.rb button{color:#fff;font-size:22px;padding:4px 8px}.rb .rt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pp{background:var(--ac);border-radius:20px;font-size:16px!important;font-weight:700;padding:7px 16px!important}
</style></head><body>
<header id="hd"></header>
<main id="m"></main>
<nav id="nv"></nav>
<div id="rd"><div id="sc"></div>
<div class="rb" id="t1"><button id="bk">‹</button><div class="rt" id="rt"></div><span id="pg" style="color:#ccc;font-size:14px"></span><button id="rf">♡</button></div>
<div class="rb" id="t2"><button id="pc">⏮</button><button class="pp" id="pp">▶ Chạy</button><button id="nc">⏭</button><span>🐢</span><input type="range" id="sp" min="1" max="14" value="4"><span>🐇</span></div></div>
<div id="mdl"></div><input type="file" id="imf" accept=".json" hidden><input type="file" id="fp" accept="image/*" hidden><input type="file" id="fb" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s),G=['Hành động','Tình cảm','Hài hước','Phiêu lưu','Kinh dị','Fantasy','Đời thường','Khác'];
let db=null,mem=new Map(),user='guest',books=[],view='home',gen='Trang chủ',sub='',qv='',urls={},hi=0,hero=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const open=()=>new Promise(r=>{try{const q=indexedDB.open('mangotv',1);q.onupgradeneeded=()=>q.result.createObjectStore('books',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=q.onblocked=()=>r()}catch(e){r()}});
const put=b=>db?new Promise(r=>{const t=db.transaction('books','readwrite');t.objectStore('books').put(b);t.oncomplete=t.onerror=r}):mem.set(b.id,b);
const del=id=>db?new Promise(r=>{const t=db.transaction('books','readwrite');t.objectStore('books').delete(id);t.oncomplete=t.onerror=r}):mem.delete(id);
const all=()=>db?new Promise(r=>{const q=db.transaction('books').objectStore('books').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}):[...mem.values()];
async function load(){books=(await all()).filter(b=>b.user===user);draw()}
const chs=b=>b.ch||(b.ch=[{n:'1',pages:b.pages}]);
const cover=b=>urls[b.id]||(urls[b.id]=URL.createObjectURL(b.cover||chs(b)[0].pages[0]));
const bgu=b=>urls[b.id+'bg']||(urls[b.id+'bg']=URL.createObjectURL(b.bg||b.cover||chs(b)[0].pages[0]));
const prog=b=>Math.min(1,((b.cur||0)+(b.pos||0))/chs(b).length);
const npg=b=>chs(b).reduce((s,c)=>s+c.pages.length,0);
let dId='';const detail=()=>books.find(b=>b.id==dId);
function bookH(){const b=detail();if(!b)return em('Không tìm thấy truyện.');const cs=chs(b),k=b.cur||0;
 return (b.bg?`<div class="bn"><img src="${bgu(b)}"></div>`:'')+`<div class="dt${b.bg?' up':''}"><div class="cv"><img src="${cover(b)}"></div><div><h1>${esc(b.title)}</h1><div class="sb">${esc(b.genres.join(' · '))}</div><div class="sb">${cs.length} chap · ${npg(b)} trang</div><button class="hb2 ${b.fav?'on':''}" data-f="${b.id}">${b.fav?'♥ Đã thích':'♡ Yêu thích'}</button></div></div><div class="fl" style="padding:0 16px"><button class="bt" data-rd="${b.id}:${b.last?k:0}">▶ ${b.last?'Đọc tiếp chap '+cs[k].n:'Đọc từ chap '+cs[0].n}</button><button class="bt g" data-a="addch">＋ Thêm chap</button></div><div class="fl" style="padding:10px 16px 0"><button class="bt g" data-a="ps1" style="font-size:14px;padding:11px 4px">🖼 Đổi poster</button><button class="bt g" data-a="ps2" style="font-size:14px;padding:11px 4px">🌄 Đổi ảnh nền</button><button class="bt g" data-a="delbk" style="font-size:14px;padding:11px 4px;color:#ff4d6a">🗑 Xóa truyện</button></div><h2>Danh sách chap (${cs.length})</h2>`+cs.map((c,i)=>`<div class="li" data-rd="${b.id}:${i}"><div style="flex:1"><div class="tt" style="margin:0">Chap ${esc(c.n)}</div><div class="sb">${c.pages.length} trang${k==i&&b.last?' · đang đọc':''}</div></div><button class="x" data-dc="${b.id}:${i}">✕</button></div>`).join('')}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mtv:'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
user=ls.get('mtv_user','guest');
const by=k=>[...books].sort((a,b)=>(b[k]||0)-(a[k]||0));
/* views */
const IC={home:'<path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-5h4v5"/>',hist:'<rect x="3" y="4" width="18" height="14" rx="3"/><path d="M10 8.5l5 2.5-5 2.5z"/><path d="M8 21h8"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'};
const NV=[['home','Trang chủ'],['hist','Lịch sử'],['search','Tìm kiếm'],['me','Tôi']];
function nav(){$('#nv').innerHTML=NV.map(([v,t])=>{const on=view==v&&!sub;if(v=='me'&&on)return `<button class="mep on" data-v="me"><div class="av">${user=='guest'?'👤':esc(user.slice(0,2).toUpperCase())}</div>Tài khoản</button>`;return `<button data-v="${v}" class="${on?'on':''}"><svg viewBox="0 0 24 24">${IC[v]}</svg>${t}</button>`}).join('')}
function hdr(){const H=$('#hd');
  if(sub){H.innerHTML=`<div class="top"><button class="ib" data-a="back">‹</button><div class="ttl">${sub=='book'?esc((detail()||{title:''}).title):sub=='fav'?'Yêu thích':'Thư viện của tôi'}</div></div>`}
  else if(view=='home')H.innerHTML=`<div class="top"><div class="logo"><span class="lg">🥭</span>MangoTruyện</div><button class="vip" data-a="add"><i>◆</i>Thêm</button></div><div class="tabs">${['Trang chủ',...G].map(g=>`<button class="tb1 ${g==gen?'on':''}" data-t="${g}">${g}</button>`).join('')}</div>`;
  else if(view=='search')H.innerHTML=`<div class="top"><label class="sr">🔍<input id="q" value="${esc(qv)}" placeholder="Tìm tên truyện, thể loại…" autocomplete="off"></label></div>`;
  else if(view=='hist')H.innerHTML=`<div class="top"><div class="ttl">Lịch sử đọc</div><button class="vip" data-a="clr">Xóa hết</button></div>`;
  else H.innerHTML=''}
const card=(b,l)=>`<div class="cd" data-o="${b.id}"><div class="cv ${l?'l':''}"><img src="${cover(b)}" alt="">${l?`<span class="bg">${esc(b.genres[0]||'Truyện')}</span>`:''}<button class="hb ${b.fav?'on':''}" data-f="${b.id}">${b.fav?'♥':'♡'}</button>${b.last?`<div class="bar"><i style="width:${Math.round(prog(b)*100)}%"></i></div>`:''}</div><div class="tt">${esc(b.title)}</div><div class="sb">${chs(b).length} chap</div></div>`;
const g3=a=>`<div class="g3">${a.map(b=>card(b)).join('')}</div>`,sec=(t,h)=>h?`<h2>${t}</h2>${h}`:'';
const em=(t,b)=>`<div class="em">${t}${b?`<div class="b2" data-a="add">＋ Thêm truyện</div>`:''}</div>`;
const heroH=()=>{if(!hero.length)return'';const b=hero[hi%hero.length];return `<div class="hero" data-o="${b.id}"><img src="${bgu(b)}"><div class="ht"><h1>${esc(b.title)}</h1><p>${b.last?'Đọc tiếp · Chap '+chs(b)[b.cur||0].n:chs(b).length+' chap'} · ${esc(b.genres[0]||'Truyện')}</p></div><div class="dots">${hero.map((_,i)=>`<i class="${i==hi%hero.length?'on':''}"></i>`).join('')}</div></div>`};
function main(){const M=$('#m');let h='';
  if(sub=='book')h=bookH();else if(sub){const a=sub=='fav'?books.filter(b=>b.fav):by('added');h=a.length?`<div style="height:6px"></div>`+g3(a):em(sub=='fav'?'Chưa có truyện yêu thích.<br>Bấm ♡ trên bìa truyện.':'Thư viện trống.',sub!='fav')}
  else if(view=='home'){
    const pool=gen=='Trang chủ'?books:books.filter(b=>b.genres.includes(gen));
    hero=(gen=='Trang chủ'?[...by('last').filter(b=>b.last),...by('added')].filter((b,i,a)=>a.indexOf(b)==i):by('added').filter(b=>pool.includes(b))).slice(0,5);hi=0;
    if(!books.length)h=em('Chưa có truyện nào.<br>Thêm ảnh hoặc tệp truyện từ thiết bị / Google Drive.',1);
    else if(gen=='Trang chủ'){const ct=by('last').filter(b=>b.last&&prog(b)<.98).slice(0,4);
      h=heroH()+sec('Tiếp tục đọc',ct.length?`<div class="g2">${ct.map(b=>card(b,1)).join('')}</div>`:'')+sec('Mới thêm',g3(by('added').slice(0,9)))+G.map(g=>{const a=books.filter(b=>b.genres.includes(g));return a.length?sec(g,g3(a.slice(0,6))):''}).join('')}
    else h=pool.length?heroH()+sec(gen,g3(by('added').filter(b=>pool.includes(b)))):em('Chưa có truyện thể loại “'+esc(gen)+'”.',1)}
  else if(view=='search'){const q=qv.trim().toLowerCase();h=q?(()=>{const r=books.filter(b=>(b.title+' '+b.genres.join(' ')).toLowerCase().includes(q));return r.length?sec(r.length+' kết quả',g3(r)):em('Không tìm thấy “'+esc(qv)+'”.')})():em('Nhập tên truyện hoặc thể loại để tìm.')}
  else if(view=='hist'){const a=by('last').filter(b=>b.last);h=a.length?`<div style="height:8px"></div>`+a.map(b=>`<div class="li" data-o="${b.id}"><div class="cv"><img src="${cover(b)}"></div><div><div class="tt" style="margin:0">${esc(b.title)}</div><div class="sb">Chap ${esc(chs(b)[b.cur||0].n)} · trang ${b.page||1}</div><div class="sb">${new Date(b.last).toLocaleString('vi-VN')}</div></div><button class="x" data-h="${b.id}">✕</button></div>`).join(''):em('Bạn chưa đọc truyện nào.')}
  else h=me();
  M.innerHTML=h}
function me(){const g=user=='guest',n=a=>`<span class="cn">▶ ${a}</span>`;
  return `<div class="me"><div class="tl">
  <button class="tile" data-s="fav"><span class="e">❤️</span><span class="r">Yêu thích ${n(books.filter(b=>b.fav).length)}</span></button>
  <button class="tile" data-v="hist"><span class="e">🕘</span><span class="r">Lịch sử ${n(books.filter(b=>b.last).length)}</span></button>
  <button class="tile" data-s="lib"><span class="e">📂</span><span class="r">Thư viện ${n(books.length)}</span></button>
  <button class="tile" data-a="add"><span class="e">🖼️</span><span class="r">Thêm truyện ${n('＋')}</span></button></div>
  <h3>Tài khoản</h3><div class="grp">
  <button class="rw" data-a="${g?'login':'x'}"><span class="ic">${g?'🔑':'👤'}</span>${g?'Đăng nhập / Đăng ký':esc(user)}</button>
  <button class="rw" data-a="ex"><span class="ic">⬇</span>Sao lưu dữ liệu</button>
  <button class="rw" data-a="im"><span class="ic">⬆</span>Khôi phục dữ liệu</button></div>
  <h3>Cài đặt</h3><div class="grp">
  <button class="rw" data-a="clr"><span class="ic">🧹</span>Xóa lịch sử đọc</button>
  ${g?'':'<button class="rw" data-a="lo"><span class="ic">↪</span>Đăng xuất</button>'}</div>
  <p class="mu">Dữ liệu lưu trên thiết bị này. Dùng “Sao lưu” để mang sang máy khác hoặc cất lên Google Drive.</p></div>`}
function draw(){nav();hdr();main();window.scrollTo(0,0)}
setInterval(()=>{const e=document.querySelector('.hero');if(!e||hero.length<2||view!='home'||sub||$('#rd').classList.contains('on'))return;hi++;e.outerHTML=heroH()},4200);
const modal=h=>$('#mdl').innerHTML=h?`<div class="md" id="mb"><div class="sh">${h}</div></div>`:'';
function authUI(){modal(`<h3>Đăng nhập / Đăng ký</h3><input class="f" id="un" placeholder="Tên đăng nhập" autocapitalize="none"><input class="f" id="pw" type="password" placeholder="Mật khẩu (≥4 ký tự)"><div class="fl"><button class="bt" data-a="li">Đăng nhập</button><button class="bt g" data-a="rg">Đăng ký</button></div><p class="mu" id="ms"></p>`)}
let sel=new Set(['Khác']);
let addTo='',posterF=null,bgF=null;function addUI(bid){addTo=bid||'';posterF=bgF=null;const bb=bid?books.find(b=>b.id==bid):null;const nx=bb?Math.max(0,...chs(bb).map(c=>parseFloat(c.n)||0))+1:1;modal(`<h3>${bb?'Thêm chap · '+esc(bb.title):'Thêm truyện'}</h3>${bb?'':'<input class="f" id="ti" placeholder="Tên truyện (bỏ trống = lấy theo tệp)">'}<input class="f" id="cn" inputmode="decimal" value="${nx}" placeholder="Số chap"><p class="mu" style="margin:-4px 0 10px">Số chap bắt đầu. Chọn nhiều tệp ZIP/CBZ thì mỗi tệp là 1 chap, đánh số tăng dần.</p><div class="chips" style="display:${bb?'none':'flex'}">${G.map(g=>`<button class="chip ${sel.has(g)?'on':''}" data-s2="${g}">${g}</button>`).join('')}</div>
  ${bb?'':'<div class="fl"><button class="bt g" data-a="ps1" id="b1">🖼 Poster</button><button class="bt g" data-a="ps2" id="b2">🌄 Ảnh nền</button></div><p class="mu" style="margin:6px 0 10px">Poster (bìa dọc) và ảnh nền (banner ngang) lấy từ thiết bị, không bắt buộc. Chọn trước rồi mới chọn tệp truyện.</p>'}<button class="bt" data-a="p1">🖼️ Chọn ảnh / ZIP-CBZ (thiết bị hoặc Drive)</button><button class="bt g" data-a="p2">📁 Chọn cả thư mục ảnh</button>
  <input type="file" id="f1" multiple accept="image/*,.zip,.cbz,application/zip" hidden><input type="file" id="f2" webkitdirectory hidden>
  <p class="mu">Trên điện thoại, chọn nguồn “Drive” khi mở hộp chọn tệp để lấy truyện từ Google Drive. Ảnh tự xếp theo tên (1, 2, 3…).</p><p id="ps" class="mu"></p>`)}
const nat=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
const isImg=f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(f.name);
async function ingest(files){const ps=$('#ps');files=[...files].sort(nat);let pages=[],t='';
  try{for(const f of files){
    if(/\.(zip|cbz)$/i.test(f.name)){ps.textContent='Đang giải nén '+f.name+'…';t=t||f.name.replace(/\.\w+$/,'');
      const z=await JSZip.loadAsync(f),en=Object.values(z.files).filter(e=>!e.dir&&/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(e.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
      for(const e of en){const bl=await e.async('blob');pages.push(new Blob([bl],{type:'image/'+e.name.split('.').pop().toLowerCase().replace('jpg','jpeg')}))}}
    else if(isImg(f)){pages.push(f);t=t||(f.webkitRelativePath?f.webkitRelativePath.split('/')[0]:f.name.replace(/\.\w+$/,''))}}
  }catch(e){ps.textContent='Lỗi đọc tệp: '+e.message;return}
  if(!pages.length){ps.textContent='Không tìm thấy ảnh hợp lệ.';return}
  await put({id:Date.now()+''+Math.random().toString(36).slice(2,6),user,title:$('#ti').value.trim()||t||'Truyện mới',genres:[...sel],fav:false,added:Date.now(),last:0,page:1,pos:0,pages});
  modal('');load()}
async function ingest2(files){const ps=$('#ps');files=[...files].sort(nat);const zips=files.filter(f=>/\.(zip|cbz)$/i.test(f.name)),imgs=files.filter(isImg);let n0=parseFloat($('#cn').value);if(isNaN(n0))n0=1;const cs=[];let t='';
 try{for(const f of zips){ps.textContent='Đang giải nén '+f.name+'…';t=t||f.name.replace(/\.\w+$/,'');const z=await JSZip.loadAsync(f),en=Object.values(z.files).filter(e=>!e.dir&&/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(e.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));const pages=[];for(const e of en){const bl=await e.async('blob');pages.push(new Blob([bl],{type:'image/'+e.name.split('.').pop().toLowerCase().replace('jpg','jpeg')}))}if(pages.length)cs.push({pages})}}catch(e){ps.textContent='Lỗi đọc tệp: '+e.message;return}
 if(imgs.length){cs.push({pages:imgs});t=t||(imgs[0].webkitRelativePath?imgs[0].webkitRelativePath.split('/')[0]:imgs[0].name.replace(/\.\w+$/,''))}
 if(!cs.length){ps.textContent='Không tìm thấy ảnh hợp lệ.';return}
 cs.forEach((c,i)=>c.n=String(n0+i));
 if(addTo){const b=books.find(b=>b.id==addTo),k=chs(b)[b.cur||0].n;b.ch.push(...cs);b.ch.sort((a,c)=>parseFloat(a.n)-parseFloat(c.n));b.cur=Math.max(0,b.ch.findIndex(c=>c.n==k));await put(b)}
 else await put({id:Date.now()+''+Math.random().toString(36).slice(2,6),user,title:($('#ti')||{value:''}).value.trim()||t||'Truyện mới',genres:[...sel],fav:false,added:Date.now(),last:0,cur:0,page:1,pos:0,ch:cs,cover:posterF||cs[0].pages[0],bg:bgF||null});
 modal('');load()}
/* reader */
let cur=null,auto=false,raf=0,fy=0;
function readBook(id,ci){cur=books.find(b=>b.id==id);if(!cur)return;ci=ci??(cur.cur||0);if(ci!=(cur.cur||0)||!cur.last){cur.pos=0;cur.page=1}cur.cur=ci;const sc=$('#sc');
  sc.innerHTML=chs(cur)[ci].pages.map(p=>`<img loading="lazy" src="${URL.createObjectURL(p)}" alt="">`).join('');
  $('#rt').textContent=cur.title+' · Chap '+chs(cur)[ci].n;$('#rf').textContent=cur.fav?'♥':'♡';$('#rf').style.color=cur.fav?'#ff4d6a':'#fff';$('#rd').className='on';document.body.style.overflow='hidden';
  cur.last=Date.now();const im=[...sc.querySelectorAll('img')];let n=0;
  const go=()=>{sc.scrollTop=(cur.pos||0)*(sc.scrollHeight-sc.clientHeight);upd()};
  im.forEach(i=>i.onload=i.onerror=()=>{if(++n==im.length)go()});setTimeout(go,900);upd()}
function upd(){const sc=$('#sc');if(!cur)return;const r=sc.scrollTop/Math.max(1,sc.scrollHeight-sc.clientHeight);cur.pos=Math.min(1,r);const L=chs(cur)[cur.cur||0].pages.length;cur.page=Math.min(L,Math.floor(r*L)+1);$('#pg').textContent=cur.page+'/'+L}
function tick(){const sc=$('#sc');fy+=+$('#sp').value*.35;if(fy>=1){const d=Math.floor(fy);sc.scrollTop+=d;fy-=d}
  if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2){const nx=(cur.cur||0)+1;if(nx<chs(cur).length){const id=cur.id;put(cur);readBook(id,nx);setAuto(true);return}setAuto(false)}if(auto)raf=requestAnimationFrame(tick)}
function setAuto(v){auto=v;cancelAnimationFrame(raf);$('#pp').textContent=v?'⏸ Dừng':'▶ Chạy';if(v){$('#rd').classList.add('h');fy=0;raf=requestAnimationFrame(tick)}}
function closeRd(){setAuto(false);if(cur){upd();put(cur);cur=null}$('#rd').className='';$('#sc').innerHTML='';document.body.style.overflow='';load()}
$('#sc').addEventListener('scroll',upd,{passive:true});
$('#sc').addEventListener('click',()=>{if(auto)setAuto(false);$('#rd').classList.toggle('h')});
$('#pp').onclick=()=>setAuto(!auto);$('#bk').onclick=closeRd;
const step=d=>{const i=(cur.cur||0)+d;if(i<0||i>=chs(cur).length)return;const id=cur.id;setAuto(false);put(cur);readBook(id,i)};$('#pc').onclick=()=>step(-1);$('#nc').onclick=()=>step(1);
$('#rf').onclick=()=>{cur.fav=!cur.fav;$('#rf').textContent=cur.fav?'♥':'♡';$('#rf').style.color=cur.fav?'#ff4d6a':'#fff'};
/* events */
document.addEventListener('input',e=>{if(e.target.id=='q'){qv=e.target.value;main()}});
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);let x;
  if(c('#rd'))return;
  if(x=c('[data-f]')){e.stopPropagation();const b=books.find(b=>b.id==x.dataset.f);b.fav=!b.fav;await put(b);return main()}
  if(x=c('[data-h]')){e.stopPropagation();const b=books.find(b=>b.id==x.dataset.h);b.last=0;b.pos=0;await put(b);return main()}
  if(x=c('[data-dc]')){e.stopPropagation();if(!x.dataset.arm){x.dataset.arm=1;x.textContent='Xóa?';x.style.color='#ff4d6a';return}const [id,i]=x.dataset.dc.split(':'),b=books.find(b=>b.id==id);if(chs(b).length<2){x.textContent='✕';delete x.dataset.arm;x.style.color='';return}chs(b).splice(+i,1);b.cur=0;b.pos=0;await put(b);return main()}
  if(x=c('[data-rd]')){const [id,i]=x.dataset.rd.split(':');return readBook(id,+i)}
  if(x=c('[data-o]')){dId=x.dataset.o;sub='book';return draw()}
  if(x=c('[data-v]')){view=x.dataset.v;sub='';return draw()}
  if(x=c('[data-t]')){gen=x.dataset.t;return draw()}
  if(x=c('[data-s]')){sub=x.dataset.s;return draw()}
  if(x=c('[data-s2]')){const g=x.dataset.s2;sel.has(g)?sel.delete(g):sel.add(g);if(!sel.size)sel.add('Khác');x.classList.toggle('on',sel.has(g));return}
  if(c('#mb')&&!c('.sh'))return modal('');
  const a=(c('[data-a]')||{dataset:{}}).dataset.a;if(!a)return;
  if(a=='add')addUI();if(a=='addch')addUI(dId);
  if(a=='ps1')$('#fp').click();if(a=='ps2')$('#fb').click();
  if(a=='delbk'){const el=c('[data-a]');if(!el.dataset.arm){el.dataset.arm=1;el.textContent='Chạm lại để xóa';return}const b=detail();if(b){await del(b.id);delete urls[b.id];delete urls[b.id+'bg']}sub='';load()}if(a=='login')authUI();if(a=='back'){sub='';draw()}
  if(a=='p1')$('#f1').click();if(a=='p2')$('#f2').click();
  if(a=='clr'){for(const b of books){b.last=0;b.pos=0;await put(b)}draw()}
  if(a=='li'||a=='rg'){const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value,ms=$('#ms'),ac=ls.get('mtv_acc',{});
    if(n.length<3||p.length<4||n=='guest'){ms.textContent='Tên ≥3 ký tự, mật khẩu ≥4 ký tự.';return}
    const h=await sha(p);
    if(a=='rg'){if(ac[n]){ms.textContent='Tên đã tồn tại.';return}ac[n]=h;ls.set('mtv_acc',ac)}
    else if(ac[n]!==h){ms.textContent='Sai tên hoặc mật khẩu.';return}
    user=n;ls.set('mtv_user',n);modal('');load()}
  if(a=='lo'){user='guest';ls.set('mtv_user','guest');load()}
  if(a=='ex')backup();if(a=='im')$('#imf').click()});
document.addEventListener('change',async e=>{const t=e.target;
  if(t.id=='fp'||t.id=='fb'){const f=t.files[0],k=t.id=='fp'?'cover':'bg';t.value='';if(!f)return;
    if($('#mb')){if(k=='cover'){posterF=f;$('#b1').textContent='✓ '+f.name.slice(0,14)}else{bgF=f;$('#b2').textContent='✓ '+f.name.slice(0,14)}}
    else{const b=detail();if(b&&sub=='book'){b[k]=f;delete urls[b.id];delete urls[b.id+'bg'];await put(b);draw()}}return}
  if(t.id=='f1'||t.id=='f2')ingest2(t.files);
  if(t.id=='imf'&&t.files[0]){try{await restore(JSON.parse(await t.files[0].text()))}catch(er){alert('Tệp sao lưu không hợp lệ')}t.value=''}});
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function backup(){const dl=window.claude&&await claude.use('downloads').catch(()=>null);
  const out=[];for(const b of books)out.push({...b,pages:undefined,cover:await b2d(b.cover||chs(b)[0].pages[0]),bg:b.bg?await b2d(b.bg):null,ch:await Promise.all(chs(b).map(async c=>({n:c.n,pages:await Promise.all(c.pages.map(b2d))})))});
  const name=`mangotruyen-${user}.json`,blob=new Blob([JSON.stringify({v:1,user,books:out})],{type:'application/json'});
  if(dl){try{await dl.save({filename:name,data:blob})}catch(e){}return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
async function restore(d){if(!d||!d.books)throw 0;
  const d2b=u=>{const [h,s]=u.split(','),a=atob(s),n=new Uint8Array(a.length);for(let i=0;i<a.length;i++)n[i]=a.charCodeAt(i);return new Blob([n],{type:h.slice(5,h.indexOf(';'))})};
  for(const o of d.books){const ch=(o.ch||[{n:'1',pages:o.pages}]).map(c=>({n:c.n,pages:c.pages.map(d2b)}));await put({...o,user,ch,pages:undefined,cover:o.cover?d2b(o.cover):ch[0].pages[0],bg:o.bg?d2b(o.bg):null})}
  await load();alert('Đã khôi phục '+d.books.length+' truyện.')}
open().then(load);
