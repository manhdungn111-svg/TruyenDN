<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Truyện TV</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bl:#0a84ff;--mu:#8e8e93;--s1:#1c1c1e;--s2:#2c2c2e;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000}
body{color:#fff;font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1,h2{margin:0}
#bar{position:fixed;top:0;left:0;right:0;z-index:20;min-height:calc(env(safe-area-inset-top,0px) + 58px);padding:calc(env(safe-area-inset-top,0px) + 14px) 72px 12px;text-align:center;font-weight:600;background:rgba(38,38,40,.78);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);opacity:0;pointer-events:none;transition:opacity .2s}
#bar.on{opacity:1}#bar span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fx{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:22;display:flex;justify-content:space-between;pointer-events:none}#fx>*{pointer-events:auto}
.cir{width:56px;height:56px;border-radius:50%;background:rgba(70,70,74,.62);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);font-size:28px;display:grid;place-items:center;flex:none}
.cir.sm,#fx .cir{width:46px;height:46px;font-size:24px}.cir.on{color:#ff4d6a}
.ava{width:52px;height:52px;border-radius:50%;background:linear-gradient(#a8a8b3,#6b6b78);display:grid;place-items:center;font-weight:600;font-size:20px;flex:none}
.hero{position:relative;height:min(150vw,760px);overflow:hidden;touch-action:pan-y;background:#111}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(#0009 0,#0000 22%,#0000 46%,#000c 78%,#000 100%)}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);left:20px;right:16px;z-index:3;display:flex;align-items:center;justify-content:space-between}
.top h1{font-size:36px;font-weight:700;letter-spacing:-.5px}.tr{display:flex;gap:12px;align-items:center}
.hc{position:absolute;left:0;right:0;bottom:20px;z-index:2;text-align:center;padding:0 22px;cursor:pointer}
.pill{display:inline-block;border:1px solid #ffffff40;background:#0006;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px;padding:6px 16px;font-size:16px}
.hc h1,.dc h1{font-size:clamp(34px,10.5vw,54px);line-height:1.04;margin:16px 0 10px;font-weight:800;letter-spacing:-1.2px;text-shadow:0 2px 14px #0009}
.meta{font-size:17px;font-weight:600;color:#e5e5ea}.sub{color:#aeaeb2;font-size:16px}
.act{display:flex;gap:14px;justify-content:center;margin:20px 0 10px}
.btnw{background:#f2f2f7;color:#000;border-radius:17px;padding:18px 16px;font-weight:600;flex:1;max-width:390px}
.btnb{background:var(--bl);color:#fff;border-radius:14px;padding:14px 26px;font-weight:600;margin-top:18px}
.dots{display:flex;gap:12px;justify-content:center;margin-top:22px}.dots i{width:10px;height:10px;border-radius:5px;background:#ffffff66}.dots i.on{width:38px;background:#fff}
h2.rt{font-size:26px;font-weight:700;margin:32px 20px 14px;display:flex;align-items:center;gap:6px;letter-spacing:-.3px}h2 .ch{color:var(--mu);font-size:30px;line-height:.8}h2 .lk{margin-left:auto;font-size:17px;font-weight:400;color:var(--bl)}
.rw{display:flex;gap:14px;overflow-x:auto;padding:0 20px 4px;scroll-snap-type:x proximity;scrollbar-width:none}.rw::-webkit-scrollbar{display:none}
.lc{flex:none;width:min(68vw,300px);cursor:pointer;scroll-snap-align:start;min-width:0}
.im{aspect-ratio:16/11;border-radius:18px;overflow:hidden;border:1px solid #ffffff24;background:var(--s1);position:relative}.im img{width:100%;height:100%;object-fit:cover;display:block}
.lc .t{font-size:17px;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lc .s{font-size:15px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkc{display:flex;gap:12px;margin-top:6px}.rkc b{font-size:58px;font-weight:300;color:#98989d;line-height:1;letter-spacing:-2px}.rkc>div{min-width:0;padding-top:6px}.t2{font-size:17px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb{position:absolute;left:12px;right:12px;bottom:10px;height:4px;border-radius:2px;background:#ffffff40}.pb i{display:block;height:100%;border-radius:2px;background:#fff}
.gd{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 14px;padding:0 20px}.gd .lc{width:auto}@media(min-width:700px){.gd{grid-template-columns:repeat(4,1fr)}}
.lt{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px 16px}.lt h1{font-size:36px;font-weight:700;letter-spacing:-.5px}
.chp{display:flex;gap:10px;overflow-x:auto;padding:0 20px 18px;scrollbar-width:none}.chp::-webkit-scrollbar{display:none}.chp button{flex:none;background:var(--s1);border-radius:20px;padding:9px 18px;font-size:16px}.chp .on{background:#fff;color:#000}
.sf{margin:0 20px 6px;background:var(--s1);border-radius:14px;display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--mu)}.sf input{flex:1;border:0;background:none;color:#fff;font:inherit;padding:13px 0;outline:0;min-width:0}
.gt{background:linear-gradient(135deg,#34343a,#1c1c1e);border-radius:16px;padding:16px;text-align:left;font-weight:600;aspect-ratio:16/8;display:flex;flex-direction:column;justify-content:flex-end}.gt small{color:var(--mu);font-weight:400;font-size:14px}
.em{text-align:center;color:var(--mu);padding:50px 24px}.em2{text-align:center;padding:26vh 30px 0}.em2 h2{font-size:25px;margin-bottom:10px}.em2 p{color:var(--mu);margin:0}
.dh{position:relative;height:min(130vw,660px);overflow:hidden;background:#111}.dh img{width:100%;height:100%;object-fit:cover;display:block}.dh::after{content:"";position:absolute;inset:0;background:linear-gradient(#0008 0,#0000 20%,#0000 45%,#000 100%)}
.dc{position:relative;margin-top:-200px;text-align:center;padding:0 22px;z-index:2}.bds{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.bd{border:1.5px solid #6e6e73;border-radius:6px;padding:2px 8px;font-size:13px;color:#aeaeb2;font-weight:600}
.sel{display:inline-block;background:var(--s1);color:var(--bl);border-radius:16px;padding:12px 20px;font-size:21px;font-weight:600;margin:26px 20px 16px}
.ep{flex:none;width:min(80vw,340px);cursor:pointer;scroll-snap-align:start}.ep .im{aspect-ratio:16/10}.ep .k{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:15px;margin-top:10px;font-weight:600;text-transform:uppercase}.ep .k button{font-size:20px;color:var(--mu);padding:0 4px}.ep .tt{font-size:19px;margin-top:2px}.ep .ln{color:var(--bl);margin-top:8px}
.ep.ad .im{display:grid;place-items:center;border-style:dashed;color:var(--bl);font-size:44px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:21;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(34,34,36,.84);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13.5px;color:#8a8a8e}nav svg{width:34px;height:34px;fill:currentColor}nav svg.st{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}nav .on{color:var(--bl)}
.md{position:fixed;inset:0;background:#0009;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sh{background:var(--s1);width:100%;max-width:540px;border-radius:26px 26px 0 0;padding:22px 18px;max-height:92%;overflow:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}.sh h3{margin:0 0 14px;font-size:21px}
.grp{background:var(--s2);border-radius:14px;padding:0 16px;margin-bottom:14px}.lr{display:block;width:100%;text-align:left;padding:16px 0;font-size:18px;border-bottom:1px solid #3a3a3c}.lr:last-child{border:0}
input.f{width:100%;padding:13px 14px;border-radius:12px;border:0;background:var(--s2);color:#fff;font:inherit;margin-bottom:10px;outline:0}
.bt{display:block;width:100%;background:var(--bl);color:#fff;font-weight:600;border-radius:13px;padding:14px;margin-top:8px;text-align:center}.bt.g{background:var(--s2)}
.fl{display:flex;gap:10px}.fl .bt{margin-top:0}.mu{color:var(--mu);font-size:14px}
.cps{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.cp{padding:8px 14px;border-radius:18px;background:var(--s2);font-size:15px}.cp.on{background:var(--bl)}
#rd{position:fixed;inset:0;background:#000;z-index:50;display:none}#rd.on{display:block}
#sc{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none}#sc img{display:block;width:100%;max-width:820px;margin:0 auto;min-height:200px}
.rb{position:absolute;left:0;right:0;background:rgba(20,20,22,.82);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;transition:transform .2s;z-index:2}
#t1{top:0;padding-top:calc(10px + env(safe-area-inset-top,0px))}#t2{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
#rd.h #t1{transform:translateY(-110%)}#rd.h #t2{transform:translateY(110%)}
.rb input[type=range]{flex:1;accent-color:var(--bl)}.rb button{color:#fff;font-size:24px;padding:4px 8px}.rb .rt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.pp{background:#f2f2f7;color:#000!important;border-radius:20px;font-size:16px!important;font-weight:600;padding:7px 16px!important}
</style></head><body>
<div id="bar"><span></span></div><div id="fx"></div>
<main id="m"></main>
<nav id="nv"></nav>
<div id="rd"><div id="sc"></div>
<div class="rb" id="t1"><button id="bk">‹</button><div class="rt" id="rt"></div><span id="pg" style="color:#ccc;font-size:14px"></span><button id="rf">♡</button></div>
<div class="rb" id="t2"><button id="pc">⏮</button><button class="pp" id="pp">▶ Chạy</button><button id="nc">⏭</button><span>🐢</span><input type="range" id="sp" min="1" max="14" value="4"><span>🐇</span></div></div>
<div id="mdl"></div><input type="file" id="imf" accept=".json" hidden><input type="file" id="fp" accept="image/*" hidden><input type="file" id="fb" accept="image/*" hidden>
<script>
const $=s=>document.querySelector(s),G=['Hành động','Tình cảm','Hài hước','Phiêu lưu','Kinh dị','Fantasy','Đời thường','Khác'];
let db=null,mem=new Map(),user='guest',books=[],view='home',gen='Tất cả',sub='',qv='',urls={},hi=0,hero=[],dId='',addTo='',posterF=null,bgF=null,gsel=new Set(['Khác']),cur=null,auto=false,raf=0,fy=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const open=()=>new Promise(r=>{try{const q=indexedDB.open('mangotv',1);q.onupgradeneeded=()=>q.result.createObjectStore('books',{keyPath:'id'});q.onsuccess=()=>{db=q.result;r()};q.onerror=q.onblocked=()=>r()}catch(e){r()}});
const put=b=>db?new Promise(r=>{const t=db.transaction('books','readwrite');t.objectStore('books').put(b);t.oncomplete=t.onerror=r}):mem.set(b.id,b);
const del=id=>db?new Promise(r=>{const t=db.transaction('books','readwrite');t.objectStore('books').delete(id);t.oncomplete=t.onerror=r}):mem.delete(id);
const all=()=>db?new Promise(r=>{const q=db.transaction('books').objectStore('books').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])}):[...mem.values()];
async function load(){books=(await all()).filter(b=>b.user===user);draw()}
const chs=b=>b.ch||(b.ch=[{n:'1',pages:b.pages}]);
const cover=b=>urls[b.id]||(urls[b.id]=URL.createObjectURL(b.cover||chs(b)[0].pages[0]));
const bgu=b=>urls[b.id+'bg']||(urls[b.id+'bg']=URL.createObjectURL(b.bg||b.cover||chs(b)[0].pages[0]));
const chu=(b,i)=>{const c=chs(b)[i],k='c'+b.id+'_'+c.n;return urls[k]||(urls[k]=URL.createObjectURL(c.pages[0]))};
const prog=b=>Math.min(1,((b.cur||0)+(b.pos||0))/chs(b).length);
const npg=b=>chs(b).reduce((s,c)=>s+c.pages.length,0);
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mtv:'+s)))].map(x=>x.toString(16).padStart(2,'0')).join('');
user=ls.get('mtv_user','guest');
const by=k=>[...books].sort((a,b)=>(b[k]||0)-(a[k]||0)),detail=()=>books.find(b=>b.id==dId),ini=()=>user=='guest'?'KH':esc(user.slice(0,2).toUpperCase());
/* nav */
const IC={home:'<path d="M12 3l9.5 7.8V21H15v-6.5H9V21H2.5V10.8z"/>',genre:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',fav:'<path d="M12 21.5S3 15.8 3 9.6A5 5 0 0112 6.8 5 5 0 0121 9.6c0 6.2-9 11.9-9 11.9z"/>',lib:'<rect x="5" y="2.5" width="14" height="3.5" rx="1.7"/><rect x="3" y="8" width="18" height="13.5" rx="3.5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>'};
const NV=[['home','Trang chủ'],['genre','Thể loại'],['fav','Yêu thích'],['lib','Thư viện'],['search','Tìm kiếm']];
const nav=()=>$('#nv').innerHTML=NV.map(([v,t])=>`<button data-v="${v}" class="${view==v?'on':''}"><svg viewBox="0 0 24 24" ${v=='search'?'class="st"':''}>${IC[v]}</svg>${t}</button>`).join('');
const TT={home:'Trang chủ',genre:'Thể loại',fav:'Yêu thích',lib:'Thư viện',search:'Tìm kiếm'};
const fxH=()=>{const b=sub=='book'&&detail();$('#fx').innerHTML=b?`<button class="cir" data-a="back">‹</button><div style="display:flex;gap:10px"><button class="cir ${b.fav?'on':''}" data-f="${b.id}">${b.fav?'♥':'＋'}</button><button class="cir" data-a="menu">⋯</button></div>`:''};
function onScroll(){const y=scrollY,th=sub=='book'?innerWidth*.8:view=='home'?innerHeight*.5:50;$('#bar').classList.toggle('on',y>th)}
addEventListener('scroll',onScroll,{passive:true});
/* cards */
const card=(b,pb)=>`<div class="lc" data-o="${b.id}"><div class="im"><img src="${bgu(b)}" alt="">${pb&&b.last?`<div class="pb"><i style="width:${Math.round(prog(b)*100)}%"></i></div>`:''}</div><div class="t">${esc(b.title)}</div><div class="s">${esc(b.genres[0]||'Truyện')} · ${chs(b).length} chap</div></div>`;
const rank=(b,i)=>`<div class="lc" data-o="${b.id}"><div class="im"><img src="${bgu(b)}" alt=""></div><div class="rkc"><b>${i+1}</b><div><div class="t2">${esc(b.title)}</div><div class="s">${esc(b.genres[0]||'Truyện')}</div></div></div></div>`;
const row=(t,a,fn,g)=>a.length?`<h2 class="rt" ${g?`data-g="${g}"`:''}>${t}${g?'<span class="ch">›</span>':''}</h2><div class="rw">${a.map(fn).join('')}</div>`:'';
const lt=t=>`<div class="lt"><h1>${t}</h1><button class="ava" data-a="acc">${ini()}</button></div>`;
const em=t=>`<div class="em">${t}</div>`;
const empty=(t,p)=>`<div class="em2"><h2>${t}</h2><p>${p}</p><button class="btnb" data-a="add">＋ Thêm truyện</button></div>`;
const heroH=()=>{if(!hero.length)return'';const n=hero.length,b=hero[((hi%n)+n)%n],k=b.cur||0,cs=chs(b);
 return `<div class="hero" id="hero"><img src="${bgu(b)}" alt=""><div class="top"><h1>Trang chủ</h1><div class="tr"><button class="cir sm" data-a="add">＋</button><button class="ava" data-a="acc">${ini()}</button></div></div><div class="hc" data-o="${b.id}"><span class="pill">${b.last?'Đang đọc':'Mới thêm'}</span><h1>${esc(b.title)}</h1><div class="meta">Truyện tranh · ${esc(b.genres.slice(0,2).join(' · '))}</div><div class="act"><button class="btnw" data-rd="${b.id}:${b.last?k:0}">▶ ${b.last?'Đọc tiếp chap '+esc(cs[k].n):'Đọc từ chap '+esc(cs[0].n)}</button><button class="cir ${b.fav?'on':''}" data-f="${b.id}">${b.fav?'♥':'＋'}</button></div><div class="sub">${cs.length} chap · ${npg(b)} trang</div><div class="dots">${hero.map(x=>`<i class="${x===b?'on':''}"></i>`).join('')}</div></div></div>`};
function bookH(){const b=detail();if(!b)return em('Không tìm thấy truyện.');const cs=chs(b),k=b.cur||0,rel=books.filter(x=>x!==b&&x.genres.some(g=>b.genres.includes(g))).slice(0,10);
 return `<div class="dh"><img src="${bgu(b)}" alt=""></div><div class="dc"><h1>${esc(b.title)}</h1><div class="meta">Truyện tranh · ${esc(b.genres.join(' · '))}</div><div class="act"><button class="btnw" data-rd="${b.id}:${b.last?k:0}">▶ ${b.last?'Đọc tiếp chap '+esc(cs[k].n):'Đọc từ chap '+esc(cs[0].n)}</button></div><div class="sub">${cs.length} chap · ${npg(b)} trang</div><div class="bds">${b.genres.map(g=>`<span class="bd">${esc(g)}</span>`).join('')}</div></div>
 <div class="sel">${cs.length} chap</div><div class="rw">${cs.map((c,i)=>`<div class="ep" data-rd="${b.id}:${i}"><div class="im"><img src="${chu(b,i)}" alt=""></div><div class="k"><span>Chap ${esc(c.n)}</span><button data-dc="${b.id}:${i}">•••</button></div><div class="tt">${c.pages.length} trang${k==i&&b.last?' · đang đọc':''}</div><div class="ln">Đọc</div></div>`).join('')}<div class="ep ad" data-a="addch"><div class="im">＋</div><div class="k"><span>Thêm chap</span></div></div></div>`+row('Có liên quan',rel,x=>card(x));}
const srH=()=>{const q=qv.trim().toLowerCase();if(!q)return `<h2 class="rt">Duyệt theo thể loại</h2><div class="gd">${G.map(g=>`<button class="gt" data-g="${g}">${g}<small>${books.filter(b=>b.genres.includes(g)).length} truyện</small></button>`).join('')}</div>`;
 const r=books.filter(b=>(b.title+' '+b.genres.join(' ')).toLowerCase().includes(q));return r.length?`<div class="gd" style="margin-top:14px">${r.map(b=>card(b)).join('')}</div>`:em('Không tìm thấy “'+esc(qv)+'”.')};
function main(){const M=$('#m');let h='';
 if(sub=='book')h=bookH();
 else if(view=='home'){
  if(!books.length)h=lt('Trang chủ')+empty('Chưa có truyện nào','Thêm ảnh hoặc tệp truyện từ thiết bị / Google Drive để bắt đầu.');
  else{hero=[...by('last').filter(b=>b.last),...by('added')].filter((b,i,a)=>a.indexOf(b)==i).slice(0,6);
   h=heroH()+row('Tiếp tục đọc',by('last').filter(b=>b.last&&prog(b)<.98).slice(0,10),b=>card(b,1))+row('Top 10 Truyện Mới Thêm',by('added').slice(0,10),rank)+row('Yêu thích',books.filter(b=>b.fav),b=>card(b))+G.map(g=>row(g,books.filter(b=>b.genres.includes(g)).slice(0,10),b=>card(b),g)).join('')}}
 else if(view=='genre'){const a=by('added').filter(b=>gen=='Tất cả'||b.genres.includes(gen));
  h=lt('Thể loại')+`<div class="chp">${['Tất cả',...G].map(g=>`<button data-g="${g}" class="${g==gen?'on':''}">${g}</button>`).join('')}</div>`+(a.length?`<div class="gd">${a.map(b=>card(b)).join('')}</div>`:em('Chưa có truyện thể loại này.'))}
 else if(view=='fav'){const a=books.filter(b=>b.fav);h=lt('Yêu thích')+(a.length?`<div class="gd">${a.map(b=>card(b)).join('')}</div>`:em('Chưa có truyện yêu thích.<br>Bấm ＋ trên trang truyện để thêm.'))}
 else if(view=='lib'){const hs=by('last').filter(b=>b.last);
  h=lt('Thư viện')+(books.length?(hs.length?`<h2 class="rt" style="margin-top:6px">Đã đọc gần đây<button class="lk" data-a="clr">Xóa</button></h2><div class="rw">${hs.slice(0,10).map(b=>card(b,1)).join('')}</div>`:'')+`<h2 class="rt">Tất cả truyện</h2><div class="gd">${by('added').map(b=>card(b)).join('')}</div>`:empty('Thư viện của bạn trống','Truyện bạn thêm từ thiết bị hoặc Google Drive sẽ xuất hiện tại đây.'))}
 else h=lt('Tìm kiếm')+`<label class="sf">🔍<input id="q" value="${esc(qv)}" placeholder="Tên truyện, thể loại" autocomplete="off"></label><div id="sr">${srH()}</div>`;
 M.innerHTML=h}
function draw(){nav();hi=0;$('#bar span').textContent=sub=='book'?(detail()||{title:''}).title:TT[view];fxH();main();scrollTo(0,0);onScroll()}
const refresh=()=>{fxH();main()};
const heroDraw=()=>{const e=$('#hero');if(e)e.outerHTML=heroH()};
setInterval(()=>{if(view!='home'||sub||!$('#hero')||hero.length<2||$('#rd').classList.contains('on')||$('#mb'))return;hi++;heroDraw()},5000);
let tx=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(!e.target.closest('#hero')||hero.length<2)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50){hi=(hi+(d<0?1:hero.length-1))%hero.length;heroDraw()}},{passive:true});
/* sheets */
const modal=h=>$('#mdl').innerHTML=h?`<div class="md" id="mb"><div class="sh">${h}</div></div>`:'';
function acct(){const g=user=='guest';modal(`<div style="display:flex;gap:14px;align-items:center;margin-bottom:18px"><div class="ava">${ini()}</div><div><b style="font-size:21px">${g?'Khách':esc(user)}</b><div class="mu">${g?'Chưa đăng nhập':'Đã đăng nhập'} · ${books.length} truyện</div></div></div><div class="grp">${g?'<button class="lr" data-a="login">🔑 Đăng nhập / Đăng ký</button>':''}<button class="lr" data-a="add">🖼️ Thêm truyện</button><button class="lr" data-a="ex">⬇ Sao lưu dữ liệu</button><button class="lr" data-a="im">⬆ Khôi phục dữ liệu</button><button class="lr" data-a="clr">🧹 Xóa lịch sử đọc</button>${g?'':'<button class="lr" data-a="lo" style="color:#ff453a">↪ Đăng xuất</button>'}</div><p class="mu">Dữ liệu lưu trên thiết bị này. Dùng “Sao lưu” để chuyển sang máy khác hoặc cất lên Google Drive.</p>`)}
const menuUI=()=>modal(`<div class="grp"><button class="lr" data-a="addch">＋ Thêm chap</button><button class="lr" data-a="ps1">🖼 Đổi poster</button><button class="lr" data-a="ps2">🌄 Đổi ảnh nền</button><button class="lr" data-a="delbk" style="color:#ff453a">🗑 Xóa truyện</button></div>`);
const authUI=()=>modal(`<h3>Đăng nhập / Đăng ký</h3><input class="f" id="un" placeholder="Tên đăng nhập" autocapitalize="none"><input class="f" id="pw" type="password" placeholder="Mật khẩu (≥4 ký tự)"><div class="fl"><button class="bt" data-a="li">Đăng nhập</button><button class="bt g" data-a="rg">Đăng ký</button></div><p class="mu" id="ms"></p>`);
function addUI(bid){addTo=bid||'';posterF=bgF=null;const bb=bid?books.find(b=>b.id==bid):null;const nx=bb?Math.max(0,...chs(bb).map(c=>parseFloat(c.n)||0))+1:1;
 modal(`<h3>${bb?'Thêm chap · '+esc(bb.title):'Thêm truyện'}</h3>${bb?'':'<input class="f" id="ti" placeholder="Tên truyện (bỏ trống = lấy theo tệp)">'}<input class="f" id="cn" inputmode="decimal" value="${nx}" placeholder="Số chap"><p class="mu" style="margin:-4px 0 10px">Số chap bắt đầu. Chọn nhiều tệp ZIP/CBZ thì mỗi tệp là 1 chap, đánh số tăng dần.</p><div class="cps" style="display:${bb?'none':'flex'}">${G.map(g=>`<button class="cp ${gsel.has(g)?'on':''}" data-s2="${g}">${g}</button>`).join('')}</div>
 ${bb?'':'<div class="fl"><button class="bt g" data-a="ps1" id="b1">🖼 Poster</button><button class="bt g" data-a="ps2" id="b2">🌄 Ảnh nền</button></div><p class="mu" style="margin:6px 0 10px">Poster và ảnh nền lấy từ thiết bị, không bắt buộc. Chọn trước rồi mới chọn tệp truyện.</p>'}
 <button class="bt" data-a="p1">Chọn ảnh / ZIP-CBZ (thiết bị hoặc Drive)</button><button class="bt g" data-a="p2">Chọn cả thư mục ảnh</button>
 <input type="file" id="f1" multiple accept="image/*,.zip,.cbz,application/zip" hidden><input type="file" id="f2" webkitdirectory hidden>
 <p class="mu">Trên điện thoại, chọn nguồn “Drive” khi mở hộp chọn tệp để lấy truyện từ Google Drive. Ảnh tự xếp theo tên (1, 2, 3…).</p><p id="ps" class="mu"></p>`)}
const nat=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
const isImg=f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(f.name);
async function ingest2(files){const ps=$('#ps');files=[...files].sort(nat);const zips=files.filter(f=>/\.(zip|cbz)$/i.test(f.name)),imgs=files.filter(isImg);let n0=parseFloat($('#cn').value);if(isNaN(n0))n0=1;const cs=[];let t='';
 try{for(const f of zips){ps.textContent='Đang giải nén '+f.name+'…';t=t||f.name.replace(/\.\w+$/,'');const z=await JSZip.loadAsync(f),en=Object.values(z.files).filter(e=>!e.dir&&/\.(jpe?g|png|webp|gif|avif|bmp)$/i.test(e.name)).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));const pages=[];for(const e of en){const bl=await e.async('blob');pages.push(new Blob([bl],{type:'image/'+e.name.split('.').pop().toLowerCase().replace('jpg','jpeg')}))}if(pages.length)cs.push({pages})}}catch(e){ps.textContent='Lỗi đọc tệp: '+e.message;return}
 if(imgs.length){cs.push({pages:imgs});t=t||(imgs[0].webkitRelativePath?imgs[0].webkitRelativePath.split('/')[0]:imgs[0].name.replace(/\.\w+$/,''))}
 if(!cs.length){ps.textContent='Không tìm thấy ảnh hợp lệ.';return}
 cs.forEach((c,i)=>c.n=String(n0+i));
 if(addTo){const b=books.find(b=>b.id==addTo),k=chs(b)[b.cur||0].n;b.ch.push(...cs);b.ch.sort((a,c)=>parseFloat(a.n)-parseFloat(c.n));b.cur=Math.max(0,b.ch.findIndex(c=>c.n==k));await put(b)}
 else await put({id:Date.now()+''+Math.random().toString(36).slice(2,6),user,title:($('#ti')||{value:''}).value.trim()||t||'Truyện mới',genres:[...gsel],fav:false,added:Date.now(),last:0,cur:0,page:1,pos:0,ch:cs,cover:posterF||cs[0].pages[0],bg:bgF||null});
 modal('');load()}
/* reader */
function readBook(id,ci){cur=books.find(b=>b.id==id);if(!cur)return;ci=ci??(cur.cur||0);if(ci!=(cur.cur||0)||!cur.last){cur.pos=0;cur.page=1}cur.cur=ci;const sc=$('#sc');
 sc.innerHTML=chs(cur)[ci].pages.map(p=>`<img loading="lazy" src="${URL.createObjectURL(p)}" alt="">`).join('');
 $('#rt').textContent=cur.title+' · Chap '+chs(cur)[ci].n;$('#rf').textContent=cur.fav?'♥':'♡';$('#rf').style.color=cur.fav?'#ff4d6a':'#fff';$('#rd').className='on';document.body.style.overflow='hidden';
 cur.last=Date.now();const im=[...sc.querySelectorAll('img')];let n=0;
 const go=()=>{sc.scrollTop=(cur.pos||0)*(sc.scrollHeight-sc.clientHeight);upd()};
 im.forEach(i=>i.onload=i.onerror=()=>{if(++n==im.length)go()});setTimeout(go,900);upd()}
function upd(){const sc=$('#sc');if(!cur)return;const r=sc.scrollTop/Math.max(1,sc.scrollHeight-sc.clientHeight);cur.pos=Math.min(1,r);const L=chs(cur)[cur.cur||0].pages.length;cur.page=Math.min(L,Math.floor(r*L)+1);$('#pg').textContent=cur.page+'/'+L}
function tick(){const sc=$('#sc');fy+=+$('#sp').value*.35;if(fy>=1){const d=Math.floor(fy);sc.scrollTop+=d;fy-=d}
 if(sc.scrollTop+sc.clientHeight>=sc.scrollHeight-2){const nx=(cur.cur||0)+1;if(nx<chs(cur).length){const id=cur.id;put(cur);readBook(id,nx);setAuto(true);return}setAuto(false)}if(auto)raf=requestAnimationFrame(tick)}
function setAuto(v){auto=v;cancelAnimationFrame(raf);$('#pp').textContent=v?'⏸ Dừng':'▶ Chạy';if(v){$('#rd').classList.add('h');fy=0;raf=requestAnimationFrame(tick)}}
function closeRd(){setAuto(false);if(cur){upd();put(cur);cur=null}$('#rd').className='';$('#sc').innerHTML='';document.body.style.overflow='';load()}
$('#sc').addEventListener('scroll',upd,{passive:true});
$('#sc').addEventListener('click',()=>{if(auto)setAuto(false);$('#rd').classList.toggle('h')});
$('#pp').onclick=()=>setAuto(!auto);$('#bk').onclick=closeRd;
const step=d=>{const i=(cur.cur||0)+d;if(i<0||i>=chs(cur).length)return;const id=cur.id;setAuto(false);put(cur);readBook(id,i)};$('#pc').onclick=()=>step(-1);$('#nc').onclick=()=>step(1);
$('#rf').onclick=()=>{cur.fav=!cur.fav;$('#rf').textContent=cur.fav?'♥':'♡';$('#rf').style.color=cur.fav?'#ff4d6a':'#fff'};
/* events */
document.addEventListener('input',e=>{if(e.target.id=='q'){qv=e.target.value;$('#sr').innerHTML=srH()}});
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(c('#rd'))return;
 if(x=c('[data-a]'))return act(x.dataset.a,x);
 if(x=c('[data-f]')){const b=books.find(b=>b.id==x.dataset.f);b.fav=!b.fav;await put(b);return refresh()}
 if(x=c('[data-dc]')){if(!x.dataset.arm){x.dataset.arm=1;x.textContent='Xóa?';x.style.color='#ff453a';return}const [id,i]=x.dataset.dc.split(':'),b=books.find(b=>b.id==id);if(chs(b).length<2){x.textContent='•••';delete x.dataset.arm;x.style.color='';return}chs(b).splice(+i,1);b.cur=0;b.pos=0;await put(b);return main()}
 if(x=c('[data-rd]')){const [id,i]=x.dataset.rd.split(':');return readBook(id,+i)}
 if(x=c('[data-o]')){dId=x.dataset.o;sub='book';return draw()}
 if(x=c('[data-v]')){view=x.dataset.v;sub='';return draw()}
 if(x=c('[data-g]')){gen=x.dataset.g;view='genre';sub='';return draw()}
 if(x=c('[data-s2]')){const g=x.dataset.s2;gsel.has(g)?gsel.delete(g):gsel.add(g);if(!gsel.size)gsel.add('Khác');x.classList.toggle('on',gsel.has(g));return}
 if(c('#mb')&&!c('.sh'))modal('')});
async function act(a,x){
 if(a=='acc')acct();if(a=='add')addUI();if(a=='addch')addUI(dId);if(a=='menu')menuUI();if(a=='login')authUI();
 if(a=='back'){sub='';draw()}
 if(a=='p1')$('#f1').click();if(a=='p2')$('#f2').click();
 if(a=='ps1'||a=='ps2'){if(!$('#b1'))modal('');$(a=='ps1'?'#fp':'#fb').click()}
 if(a=='clr'){for(const b of books){b.last=0;b.pos=0;await put(b)}modal('');main()}
 if(a=='li'||a=='rg'){const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value,ms=$('#ms'),ac=ls.get('mtv_acc',{});
  if(n.length<3||p.length<4||n=='guest'){ms.textContent='Tên ≥3 ký tự, mật khẩu ≥4 ký tự.';return}
  const h=await sha(p);
  if(a=='rg'){if(ac[n]){ms.textContent='Tên đã tồn tại.';return}ac[n]=h;ls.set('mtv_acc',ac)}
  else if(ac[n]!==h){ms.textContent='Sai tên hoặc mật khẩu.';return}
  user=n;ls.set('mtv_user',n);sub='';modal('');load()}
 if(a=='lo'){user='guest';ls.set('mtv_user','guest');sub='';modal('');load()}
 if(a=='ex')backup();if(a=='im')$('#imf').click();
 if(a=='delbk'){if(!x.dataset.arm){x.dataset.arm=1;x.textContent='Chạm lại để xóa';return}const b=detail();if(b){await del(b.id);delete urls[b.id];delete urls[b.id+'bg']}sub='';modal('');load()}}
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id=='fp'||t.id=='fb'){const f=t.files[0],k=t.id=='fp'?'cover':'bg';t.value='';if(!f)return;
  if($('#b1')){if(k=='cover'){posterF=f;$('#b1').textContent='✓ '+f.name.slice(0,14)}else{bgF=f;$('#b2').textContent='✓ '+f.name.slice(0,14)}}
  else{const b=detail();if(b&&sub=='book'){b[k]=f;delete urls[b.id];delete urls[b.id+'bg'];await put(b);refresh()}}return}
 if(t.id=='f1'||t.id=='f2')ingest2(t.files);
 if(t.id=='imf'&&t.files[0]){try{await restore(JSON.parse(await t.files[0].text()))}catch(er){alert('Tệp sao lưu không hợp lệ')}t.value=''}});
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function backup(){const dl=window.claude&&await claude.use('downloads').catch(()=>null);
  if(!dl){alert('Trình duyệt này không cho tải tệp. Hãy mở trang trong ứng dụng Claude.');return}
  const out=[];for(const b of books)out.push({...b,pages:undefined,cover:await b2d(b.cover||chs(b)[0].pages[0]),bg:b.bg?await b2d(b.bg):null,ch:await Promise.all(chs(b).map(async c=>({n:c.n,pages:await Promise.all(c.pages.map(b2d))})))});
  try{await dl.save({filename:`mangotruyen-${user}.json`,data:new Blob([JSON.stringify({v:1,user,books:out})],{type:'application/json'})})}catch(e){if(e&&e.code!='declined')alert('Không lưu được tệp.')}}
async function restore(d){if(!d||!d.books)throw 0;
  const d2b=u=>{const [h,s]=u.split(','),a=atob(s),n=new Uint8Array(a.length);for(let i=0;i<a.length;i++)n[i]=a.charCodeAt(i);return new Blob([n],{type:h.slice(5,h.indexOf(';'))})};
  for(const o of d.books){const ch=(o.ch||[{n:'1',pages:o.pages}]).map(c=>({n:c.n,pages:c.pages.map(d2b)}));await put({...o,user,ch,pages:undefined,cover:o.cover?d2b(o.cover):ch[0].pages[0],bg:o.bg?d2b(o.bg):null})}
  await load();alert('Đã khôi phục '+d.books.length+' truyện.')}
open().then(load);
</script></body></html>
